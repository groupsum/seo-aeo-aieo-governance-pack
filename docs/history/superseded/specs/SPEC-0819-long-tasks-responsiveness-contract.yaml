  "title": "Long Tasks responsiveness contract",
  "status": "superseded",
  "origin": "extension-pack",
  "summary": "Defines the governed responsiveness and blocking-observation surface for long tasks using the W3C Long Tasks API authority layer.",
  "body": "The Long Tasks responsiveness contract SHALL define the governed responsiveness and blocking-observation surface for long tasks using the W3C Long Tasks API authority layer.\n\nThis contract SHALL cover:\n- long-task detection for work that monopolizes the UI thread\n- the standards-backed threshold model in which tasks exceeding 50 milliseconds are surfaced as long tasks\n- attribution-oriented observation that helps distinguish first-party, third-party, and rendering-related blocking causes where supported\n\nGoverned implementations SHOULD use long-task observation to diagnose responsiveness degradation, main-thread contention, and interaction risk.\n\nThis contract SHALL treat long-task observation as a diagnostic and governance surface for responsiveness rather than as a direct ranking metric.\n\nDownstream implementations MAY derive additional operator metrics from long-task observations, but SHALL preserve the distinction between the underlying standards-backed API and any derived tooling score.",
