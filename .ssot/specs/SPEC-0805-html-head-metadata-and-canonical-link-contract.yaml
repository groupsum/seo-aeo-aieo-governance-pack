  "slug": "html-head-metadata-and-canonical-link-contract",
  "title": "HTML head metadata and canonical link contract",
  "status": "draft",
  "origin": "extension-pack",
  "summary": "Defines the required page-level metadata surfaces that search and answer systems consume directly from the document head.",
  "body": "The HTML head metadata and canonical link contract SHALL define the required page-level metadata surfaces that search and answer systems consume directly from the document head.\n\nThis surface SHALL cover:\n- `title`\n- relevant `meta` descriptions and robots directives\n- `link rel=\"canonical\"`\n- alternate language and regional references when applicable\n- other head-level link relations required by governed consumers\n\nEach governed page SHOULD have:\n- a unique and descriptive title\n- a canonical hint that does not conflict with other canonicalization signals\n- metadata that matches the visible page content\n- stable head metadata across duplicate fetches of the same canonical page\n\nCanonical hints SHALL be internally consistent with:\n- redirect behavior\n- sitemap entries\n- internal linking patterns\n- duplicate-page handling",
