  "slug": "openai-crawler-controls-contract",
  "title": "OpenAI crawler controls contract",
  "status": "draft",
  "origin": "extension-pack",
  "summary": "Defines provider-specific crawler handling for OpenAI-operated automated access surfaces.",
  "body": "The OpenAI crawler controls contract SHALL define provider-specific crawler handling for OpenAI-operated automated access surfaces.\n\nThis contract SHALL distinguish at least the following crawler purposes where publicly documented controls exist:\n- search/result-surfacing access\n- model-training access\n- user-triggered retrieval access\n\nFor governed OpenAI handling, downstream operators SHALL distinguish:\n- `OAI-SearchBot`\n- `GPTBot`\n- `ChatGPT-User`\n\nGuidance produced under this contract SHALL:\n- avoid collapsing these user agents into a single \"OpenAI bot\" category\n- explain the operational consequence of allowing or disallowing each surface\n- preserve consistency between provider-specific controls and broader robots governance\n- document that provider controls affect provider behavior, not universal web crawler behavior\n\nThis contract is provider-specific and SHALL be maintained separately from generic robots exclusion guidance.",
