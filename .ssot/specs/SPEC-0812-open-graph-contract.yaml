  "title": "Open Graph contract",
  "status": "draft",
  "origin": "extension-pack",
  "summary": "Defines the minimum social-graph metadata needed for consistent link-preview representation across Open Graph consumers.",
  "body": "The Open Graph contract SHALL define the minimum social-graph metadata needed for consistent link-preview representation across Open Graph consumers.\n\nGoverned pages that require rich social previews SHOULD provide, at minimum:\n- `og:title`\n- `og:type`\n- `og:url`\n- `og:image`\n\nWhere applicable, governed pages SHOULD also provide:\n- `og:description`\n- `og:site_name`\n- structured image metadata such as dimensions and alternative text when supported by the consuming platform\n\nOpen Graph metadata SHALL:\n- correspond to the canonical resource being shared\n- avoid conflicting alternate identities for the same page\n- use stable, fetchable preview assets\n- remain aligned with page title, canonical URL, and visible content\n\nThis contract governs social-preview representation. It does not replace search-specific structured data or canonical metadata contracts.",
