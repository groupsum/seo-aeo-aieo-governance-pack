  "title": "AEO answer surface contract",
  "status": "draft",
  "origin": "extension-pack",
  "summary": "The AEO answer surface defines requirements for content intended to be surfaced as direct or near-direct answers in answer systems.",
  "body": "The AEO answer surface SHALL define requirements for content intended to be surfaced as direct or near-direct answers in search-adjacent answer systems.\n\nAnswer-oriented content SHALL:\n- align a question, prompt, or intent with a clear answer unit\n- preserve source attribution to a canonical resource\n- expose the answer in visible textual form\n- preserve freshness or update context when timeliness matters\n- avoid conflicting duplicate answer variants across canonical duplicates\n\nRecommended answer units include:\n- FAQ entries\n- definitions\n- product facts\n- concise process steps\n- summary paragraphs with explicit scope\n\nThe surface SHALL assume that answer extraction systems may select only part of a page. Therefore, the answer unit itself SHOULD be locally intelligible without relying on hidden context.",
