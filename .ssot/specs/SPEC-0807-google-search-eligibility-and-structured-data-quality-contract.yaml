  "title": "Google Search eligibility and structured data quality contract",
  "status": "draft",
  "origin": "extension-pack",
  "summary": "Defines the Google-specific baseline needed for search appearance eligibility, including rich-result eligibility where applicable.",
  "body": "The Google Search eligibility and structured data quality contract SHALL define the Google-specific baseline needed for search appearance eligibility, including rich-result eligibility where applicable.\n\nThis surface SHALL align with:\n- Google Search Essentials\n- Google's technical requirements\n- Google's structured data quality and policy guidance\n- supported Search Central rich-result feature guidance\n\nContent governed by this contract SHALL:\n- remain crawlable and index-eligible where appearance is desired\n- comply with spam and structured-data policy constraints\n- ensure structured data matches visible content\n- avoid misleading, irrelevant, or fake markup\n- keep time-sensitive structured data current\n- use supported types only where the page qualifies for them\n\nThis contract SHALL explicitly state that correctly-authored structured data enables eligibility for richer appearances but does not guarantee display.",
