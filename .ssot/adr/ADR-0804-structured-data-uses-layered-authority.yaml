  "slug": "structured-data-uses-layered-authority",
  "title": "Structured data uses layered authority",
  "status": "draft",
  "origin": "extension-pack",
  "summary": "Structured data is governed through layered authority, not a single undifferentiated source.",
  "body": "Structured data SHALL be governed through layered authority rather than a single undifferentiated source.\n\nThe layers are:\n- vocabulary authority: Schema.org and other adopted vocabularies\n- encoding authority: JSON-LD, RDFa, or Microdata\n- platform policy authority: search-engine or consumer-specific eligibility and quality rules\n- page authority: visible content and canonical resource state\n\nJSON-LD SHALL be the preferred encoding in this pack when a preferred encoding must be named.\n\nStructured data SHALL match visible page content and SHALL NOT be treated as an independent truth source that can contradict the rendered page.\n\nDownstream operators MAY use alternative supported encodings, but the pack SHALL describe them as secondary to the preferred JSON-LD path.",
