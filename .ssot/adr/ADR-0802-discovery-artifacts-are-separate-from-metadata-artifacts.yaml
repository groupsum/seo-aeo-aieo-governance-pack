  "slug": "discovery-artifacts-are-separate-from-metadata-artifacts",
  "title": "Discovery artifacts are separate from metadata artifacts",
  "status": "draft",
  "origin": "extension-pack",
  "summary": "Discovery artifacts and metadata artifacts are distinct optimization surfaces.",
  "body": "Discovery artifacts and metadata artifacts SHALL be modeled as separate optimization surfaces.\n\nDiscovery artifacts exist to help crawlers find resources and understand update boundaries. These include:\n- sitemap files\n- sitemap indexes\n- image, video, and news sitemap extensions\n\nMetadata artifacts exist to describe a page, resource, or entity after discovery. These include:\n- HTML title and meta elements\n- canonical links\n- structured data\n- Open Graph tags\n- X Card tags\n- other machine-readable page annotations\n\nThis pack SHALL not collapse these concerns into a single abstract SEO metadata concept. Discovery and description solve different problems and require different specifications, tests, and operator guidance.",
