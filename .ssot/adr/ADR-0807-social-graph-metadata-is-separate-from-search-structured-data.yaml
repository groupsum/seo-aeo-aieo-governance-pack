  "title": "Social graph metadata is separate from search structured data",
  "status": "draft",
  "origin": "extension-pack",
  "summary": "Social graph metadata is a distinct optimization surface from search structured data.",
  "body": "Social graph metadata SHALL be treated as a distinct optimization surface from search structured data.\n\nOpen Graph and X Card metadata exist to control link-preview and social-share rendering behavior. They are not substitutes for search structured data, and search structured data is not a substitute for them.\n\nThis pack SHALL model social preview metadata separately from:\n- Schema.org-based rich result markup\n- canonical search metadata\n- crawl-discovery artifacts\n\nWhen fields overlap, downstream implementations SHOULD keep them aligned, but the governing specifications and consumer behaviors remain distinct.",
