  "title": "llms.txt is experimental and must not outrank canonical surfaces",
  "status": "draft",
  "origin": "extension-pack",
  "summary": "llms.txt is an optional experimental artifact and not a canonical replacement surface.",
  "body": "`llms.txt` SHALL be treated as an optional experimental artifact.\n\nIt MAY be used as a curated AI-readable guide to important resources, but it is not a replacement for:\n- robots.txt\n- sitemap.xml\n- canonical HTML metadata\n- structured data\n- provider-specific crawler controls\n\nThis pack SHALL describe `llms.txt` as non-authoritative unless a downstream system explicitly elevates it through its own governance.\n\nIf present, `llms.txt` SHOULD summarize and point at canonical resources rather than introduce conflicting statements, alternate truth, or hidden policy that is absent from the site's normative surfaces.",
