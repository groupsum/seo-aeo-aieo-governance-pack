  "slug": "ai-crawler-controls-must-distinguish-search-training-and-user-triggered-fetch",
  "title": "AI crawler controls must distinguish search, training, and user-triggered fetch",
  "status": "draft",
  "origin": "extension-pack",
  "summary": "AI crawler controls must distinguish search crawl, training crawl, and user-triggered fetch.",
  "body": "AI crawler controls SHALL distinguish between at least three operational modes:\n- search or result-surfacing crawl\n- model-training crawl\n- user-triggered or agent-triggered fetch\n\nDifferent bots and user agents may serve different product purposes even when they belong to the same provider.\n\nThis pack SHALL therefore avoid provider-level blanket assumptions such as allow AI or block AI. Guidance SHALL instead model control at the crawler-purpose level whenever the provider exposes separate controls.\n\nFor OpenAI specifically, downstream guidance SHALL distinguish:\n- OAI-SearchBot\n- GPTBot\n- ChatGPT-User\n\nEquivalent distinctions SHOULD be preserved for other providers when their public guidance supports them.",
