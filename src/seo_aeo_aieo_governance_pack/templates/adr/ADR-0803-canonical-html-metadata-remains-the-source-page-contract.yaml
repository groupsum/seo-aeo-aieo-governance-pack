  "title": "Canonical HTML metadata remains the source page contract",
  "status": "draft",
  "origin": "extension-pack",
  "summary": "Canonical HTML page metadata remains the primary page-level contract for search and answer engines.",
  "body": "Canonical HTML page metadata SHALL remain the primary page-level contract for search and answer engines.\n\nThe HTML document head is the authoritative source for page-scoped metadata such as:\n- title\n- meta description hints\n- canonical URL hints\n- robots directives\n- language and alternate references\n- link relations\n\nDerived metadata layers MAY supplement HTML metadata, but SHALL NOT replace the need for correct, internally consistent page-level metadata.\n\nGuidance in this pack SHALL assume that every important page needs a stable, directly inspectable head-level contract that matches the visible resource it represents.",
