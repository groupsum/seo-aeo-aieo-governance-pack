  "slug": "google-ai-features-do-not-justify-ai-specific-schema-or-ai-only-files",
  "title": "Google AI features do not justify AI-specific schema or AI-only files",
  "status": "draft",
  "origin": "extension-pack",
  "summary": "Google AI search features are governed by normal Search eligibility rather than a separate AI-only markup regime.",
  "body": "Google AI search features SHALL be treated as extensions of normal Google Search eligibility, not as a separate markup ecosystem.\n\nThis pack adopts Google's guidance that:\n- no special AI schema is required\n- no special AI-only machine-readable file is required\n- standard search eligibility and snippet eligibility remain the operative baseline\n\nAEO and AiEO guidance for Google surfaces SHALL therefore focus on:\n- crawlability\n- indexability\n- snippet eligibility\n- canonical consistency\n- visible structured content\n- helpful, reliable, people-first content\n\nThis pack SHALL not invent Google-specific AI markup requirements that are unsupported by Google's published guidance.",
