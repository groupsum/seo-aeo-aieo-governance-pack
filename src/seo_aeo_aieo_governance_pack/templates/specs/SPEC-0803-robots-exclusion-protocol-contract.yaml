  "slug": "robots-exclusion-protocol-contract",
  "title": "Robots exclusion protocol contract",
  "status": "draft",
  "origin": "extension-pack",
  "summary": "Defines how crawler access rules are authored and interpreted for governed sites.",
  "body": "The robots exclusion protocol contract SHALL define how crawler access rules are authored and interpreted for governed sites.\n\nThis surface SHALL follow RFC 9309 semantics for:\n- `User-agent`\n- `Allow`\n- `Disallow`\n- group matching\n- longest-match behavior\n- redirect handling\n- fetch failure handling\n- caching expectations\n\nThe contract SHALL treat `robots.txt` as:\n- a crawl-management artifact\n- not an authorization mechanism\n- not a guaranteed deindexing mechanism\n\nThe contract SHALL support crawler-purpose distinctions when providers expose them, including separate groups for search, training, and other specialized automated access.\n\nDownstream guidance SHALL document that blocking a page in `robots.txt` can prevent a crawler from seeing page-level directives such as `noindex`.",
