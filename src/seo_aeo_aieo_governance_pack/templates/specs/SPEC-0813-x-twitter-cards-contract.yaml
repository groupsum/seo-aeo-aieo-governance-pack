  "slug": "x-twitter-cards-contract",
  "title": "X / Twitter Cards contract",
  "status": "draft",
  "origin": "extension-pack",
  "summary": "Defines the metadata required for governed pages that target X or Twitter preview rendering.",
  "body": "The X Card contract SHALL define the metadata required for governed pages that target X/Twitter preview rendering.\n\nGoverned pages targeting this surface SHOULD provide:\n- `twitter:card`\n- `twitter:title`\n- `twitter:description`\n- `twitter:image`\n\nWhere account or attribution context is relevant, governed pages MAY also provide:\n- `twitter:site`\n- `twitter:creator`\n\nX Card metadata SHALL:\n- represent the same canonical resource as the page and its Open Graph data\n- avoid contradictory preview titles, descriptions, or images across social metadata surfaces\n- use supported card values appropriate to the content type\n- rely on fetchable preview assets\n\nDownstream implementations MAY use Open Graph alignment as a fallback strategy, but SHALL preserve explicit X Card controls where platform-specific behavior requires them.",
