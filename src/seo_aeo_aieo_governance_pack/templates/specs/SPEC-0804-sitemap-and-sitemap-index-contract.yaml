  "slug": "sitemap-and-sitemap-index-contract",
  "title": "Sitemap and sitemap-index contract",
  "status": "draft",
  "origin": "extension-pack",
  "summary": "Defines the governed discovery artifacts used to advertise canonical URLs and update boundaries.",
  "body": "The sitemap and sitemap-index contract SHALL define the governed discovery artifacts used to advertise canonical URLs and update boundaries.\n\nThis surface SHALL cover:\n- XML sitemap structure\n- sitemap index structure\n- URL inclusion rules\n- same-site sitemap index constraints\n- optional `lastmod` freshness hints\n- partitioning of large sitemap estates\n- submission and update expectations\n\nSitemap entries SHOULD prefer canonical URLs and SHOULD avoid advertising blocked, duplicate, or intentionally non-indexable resources unless a platform-specific exception is explicitly required.\n\nSitemap artifacts SHALL be treated as discovery infrastructure. They help crawlers find and prioritize resources, but do not guarantee indexing, ranking, or rendering behavior.",
