  "slug": "aieo-citation-and-provenance-contract",
  "title": "AiEO citation and provenance contract",
  "status": "draft",
  "origin": "extension-pack",
  "summary": "The AiEO citation and provenance contract defines the minimum requirements for AI-consumable content to remain attributable and auditable.",
  "body": "The AiEO citation and provenance contract SHALL define the minimum requirements for AI-consumable content that is intended to remain attributable and auditable when reused in AI-assisted retrieval or synthesis flows.\n\nContent governed by this surface SHALL:\n- provide a canonical source URL\n- preserve stable page or entity identifiers where applicable\n- distinguish authoritative statements from derived summaries\n- expose sufficient textual context for factual reuse\n- support citation back to the originating source page\n- avoid hidden markup that contradicts visible claims\n\nProvenance-bearing content SHOULD also expose:\n- publication or update timestamps where relevant\n- responsible organization or authorship signals where relevant\n- structured entity naming that reduces ambiguity\n\nThis surface does not require proprietary AI-only markup. It requires that canonical web content remain attributable, legible, and structurally stable when consumed by AI-capable retrieval systems.",
