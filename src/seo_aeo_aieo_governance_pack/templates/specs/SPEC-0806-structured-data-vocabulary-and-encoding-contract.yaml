  "slug": "structured-data-vocabulary-and-encoding-contract",
  "title": "Structured data vocabulary and encoding contract",
  "status": "draft",
  "origin": "extension-pack",
  "summary": "Defines how machine-readable content annotations are authored for governed pages.",
  "body": "The structured data vocabulary and encoding contract SHALL define how machine-readable content annotations are authored for governed pages.\n\nThis surface SHALL recognize:\n- Schema.org as the primary shared vocabulary target\n- JSON-LD 1.1 as the preferred encoding\n- RDFa and Microdata as supported secondary encodings where required\n\nStructured data authored under this contract SHALL:\n- describe the same subject as the visible page\n- use the most specific applicable type and properties available\n- avoid misleading, hidden, stale, or irrelevant markup\n- keep referenced assets, especially images, crawlable where consumers require access\n- remain aligned with the page's canonical URL and primary entity\n\nIf multiple encodings are used, they SHOULD be semantically equivalent. Conflicting parallel encodings are not allowed under this contract.",
