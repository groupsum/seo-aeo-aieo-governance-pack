  "summary": "Defines the governed measurement semantics and operator expectations for First Contentful Paint using the W3C Paint Timing authority layer.",
  "body": "The First Contentful Paint contract SHALL define the governed measurement semantics and operator expectations for First Contentful Paint using the W3C Paint Timing authority layer.\n\nThis contract SHALL cover:\n- First Contentful Paint (FCP) as a standards-backed paint timing metric\n- measurement semantics derived from the browser timing surface rather than from custom application heuristics\n- operator reporting that distinguishes measurement from ranking claims\n\nGoverned implementations SHOULD use FCP as an early rendering signal for page usability and loading behavior.\n\nThis contract SHALL treat FCP as a page-rendering metric that helps explain the onset of visible content, but SHALL NOT treat FCP alone as sufficient evidence of good responsiveness, accessibility, or search-result quality.\n\nDownstream implementations MAY define route, template, or device-class policies for FCP targets, but the metric semantics SHALL remain anchored to the underlying standards-backed timing definition.",
