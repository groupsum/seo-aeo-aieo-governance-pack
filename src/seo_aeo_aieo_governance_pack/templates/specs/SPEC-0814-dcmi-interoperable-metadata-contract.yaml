  "slug": "dcmi-interoperable-metadata-contract",
  "title": "DCMI interoperable metadata contract",
  "status": "draft",
  "origin": "extension-pack",
  "summary": "Defines an optional metadata layer for governed content that benefits from archival, catalog, document, or cross-system interoperability.",
  "body": "The DCMI interoperable metadata contract SHALL define an optional metadata layer for governed content that benefits from archival, catalog, document, or cross-system interoperability.\n\nThis contract SHOULD be applied where content requires stable descriptive metadata beyond page-rendering and search-preview use cases.\n\nGoverned DCMI metadata MAY cover:\n- title\n- creator\n- publisher\n- subject\n- description\n- language\n- date\n- identifier\n- rights\n- relation\n\nWhen used, DCMI metadata SHALL:\n- remain semantically consistent with canonical page metadata\n- avoid introducing conflicting identifiers or titles\n- support durable document or knowledge-asset interpretation across systems\n- remain secondary to the page's primary canonical web contract\n\nThis contract is interoperability-oriented. It is not required for general search eligibility.",
