  "title": "Core Web Vitals performance contract",
  "status": "draft",
  "origin": "extension-pack",
  "summary": "Defines the governed Core Web Vitals user-experience targets that materially affect page usability and search-adjacent quality evaluation.",
  "body": "The Core Web Vitals performance contract SHALL define the governed Core Web Vitals user-experience targets that materially affect page usability and search-adjacent quality evaluation.\n\nThis contract SHALL cover:\n- Largest Contentful Paint (LCP)\n- Interaction to Next Paint (INP)\n- Cumulative Layout Shift (CLS)\n\nTarget thresholds for governed pages SHOULD align with current operator guidance at the 75th percentile, including:\n- LCP <= 2.5 seconds\n- INP <= 200 milliseconds\n- CLS <= 0.1\n\nDownstream implementations SHOULD evaluate these metrics using field-oriented measurement where practical and SHOULD distinguish:\n- template-level regressions\n- route-level regressions\n- asset-induced regressions\n- third-party script regressions\n\nThe detailed standards-backed measurement contract for LCP SHALL be defined by the dedicated Largest Contentful Paint contract.\n\nThis contract SHALL explicitly exclude Total Blocking Time from the Core Web Vitals set and SHALL treat TBT as a separate operator metric.\n\nThis contract SHALL treat performance as a governed user-experience surface, not as a guarantee of ranking outcome.",
