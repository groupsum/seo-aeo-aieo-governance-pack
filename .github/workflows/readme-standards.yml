name: README standards

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  readme-standards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install the README checker
        run: python -m pip install readme-standards==0.1.3
      - name: Check the source README
        run: readme-standards check
      - name: Build the package wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Check the wheel and run both README examples
        run: readme-standards examples --wheel dist/*.whl
