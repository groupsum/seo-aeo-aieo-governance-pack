name: ci

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  python-uv-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cobycloud/actions/actions/python-uv@master
        with:
          python-version: "3.12"
          working-directory: "."
          install-command: uv sync --all-groups
          run-command: uv run python -m unittest discover -s tests -v
