name: ci

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  python-uv-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run unit tests
        run: uv run python -m unittest discover -s tests -v
